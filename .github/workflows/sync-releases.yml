name: Sync releases from upstream

# 手动触发：Actions 页点 "Run workflow" 即同步一次（已同步的版本自动跳过）
on:
  workflow_dispatch:

# 允许在本仓库创建 Release
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: huamidev/GestaltX
    steps:
    - uses: actions/checkout@v4
      - name: Mirror all upstream releases
        run: |
          set -e
          for tag in $(gh release list -R "$UPSTREAM" --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" -R "${{ github.repository }}" > /dev/null 2>&1; then
              echo "== $tag 已存在，跳过"
              continue
            fi
            echo "== 正在同步 $tag"
            dir=$(mktemp -d)
            # 下载该版本的全部附件（ipa 等），不含源码包（源码包本仓库会自动生成）
            gh release download "$tag" -R "$UPSTREAM" --dir "$dir"
            # 取上游的标题和说明文字
            title=$(gh release view "$tag" -R "$UPSTREAM" --json name --jq '.name')
            gh release view "$tag" -R "$UPSTREAM" --json body --jq '.body' > "$dir/notes.md"
            extra=""
            if [ "$(gh release view "$tag" -R "$UPSTREAM" --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
              extra="--prerelease"
            fi
            # 在本仓库创建同名 Release 并上传附件（tag 已随 fork 一起过来，直接挂上）
            gh release create "$tag" "$dir"/* --title "${title:-$tag}" --notes-file "$dir/notes.md" $extra
            echo "== $tag 同步完成"
          done
          echo "全部同步完毕"
